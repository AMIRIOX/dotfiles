#font_family      family=JuliaMono postscript_name=JuliaMono-Light
#font_family      family=Monolisa postscript_name=Monolisa
#bold_font        family=JuliaMono postscript_name=JuliaMono-Regular
#italic_font      JuliaMono-Italic
font_family      JuliaMono
bold_font        auto
italic_font      auto
bold_italic_font auto
symbol_map U+4E00-U+9FFF,U+3400-U+4DBF,U+3000-U+303F LXGWWenkai-Regular

font_size        15.0

# background_image /Users/amiriox/workbench/bg.jpg
background_image_layout scaled

background_opacity 0.7

# Nord
background            #2e3440
foreground            #d8dee9

# Forest
#background            #2d353b
#foreground            #d3c6aa

# Rose Pine
#background             #191724
#foreground             #e0def4

# Gruvbox Material 
#background             #282828
#foreground             #dfbf8e

initial_window_width  1500
initial_window_height 1000
window_padding_width  10

allow_remote_control yes
listen_on unix:/run/user/1000/kitty-{kitty_pid}

copy_on_select yes
strip_trailing_spaces smart

# macOS Cmd has no equivalent here: Super is taken by niri (Mod), so use Alt,
# which sits where Option is on a Mac keyboard.
map alt+return toggle_fullscreen
map alt+comma edit_config_file
map shift+enter send_text all \x1b[13;2u

hide_window_decorations titlebar-only
tab_bar_style powerline
tab_title_template "[{index}]: {title}"
tab_bar_edge bottom
tab_bar_align center
active_tab_foreground #2E3440
active_tab_background #88C0D0
inactive_tab_foreground #D8DEE9
inactive_tab_background #4C566A
tab_bar_background #2E3440

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

enable_audio_bell no
command_on_bell notify-send -i utilities-terminal "Kitty" "终端有任务需要注意"
window_alert_on_bell yes
bell_on_tab "🔔 "
